name: Publish Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stage
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            app_name: gyeoltare-web
            dockerfile: apps/web/Dockerfile
          - app: api
            app_name: gyeoltare-api
            dockerfile: apps/api/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize registry owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            CI=true
            COMMIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Sign image digest
        env:
          IMAGE_NAME: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Persist digest metadata
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          node <<'EOF'
          import { writeFileSync } from "node:fs";

          const outputPath = `${process.cwd()}/published-image-${process.env.APP}.json`;
          const tags = process.env.TAGS.split("\n").filter(Boolean);
          
          const payload = {
            image: process.env.IMAGE_NAME,
            digest: process.env.DIGEST,
            tags,
            workflow: process.env.WORKFLOW_NAME,
          };

          writeFileSync(outputPath, `${JSON.stringify(payload, null, 2)}\n`);
          EOF

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: published-image-${{ matrix.app }}
          path: published-image-${{ matrix.app }}.json

      - name: Write job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## ${{ matrix.app_name }}"
            echo
            echo "- Image: \`${IMAGE_NAME}@${DIGEST}\`"
            echo "- Tags:"
            printf '%s\n' "$TAGS" | while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "  - \`${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  update-staging:
    if: github.ref == 'refs/heads/stage'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6

      - name: Download published image metadata
        uses: actions/download-artifact@v8
        with:
          pattern: published-image-*
          path: published-images
          merge-multiple: true

      - name: Create GitHub App token for ops repository
        id: ops-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_REPO_APP_PRIVATE_KEY }}
          owner: gwak2837
          repositories: |
            gyeoltare-ops
          permission-contents: write

      - name: Checkout ops repository
        uses: actions/checkout@v6
        with:
          repository: gwak2837/gyeoltare-ops
          ref: main
          fetch-depth: 0
          path: ops
          token: ${{ steps.ops-app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: 5.6.0

      - name: Update staging kustomization images
        run: node ./scripts/update-ops-image-patches.mjs --artifacts-dir ./published-images --ops-repo-dir ./ops --environment stg

      - name: Validate staging kustomize build
        run: kustomize build ./ops/k8s/workload/gyeoltare/stg >/dev/null

      - name: Ensure only staging kustomization changed
        id: changes
        working-directory: ops
        run: |
          changed_files="$(git diff --name-only)"

          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              k8s/workload/gyeoltare/stg/api/kustomization.yaml|k8s/workload/gyeoltare/stg/web/kustomization.yaml)
                ;;
              *)
                echo "Unexpected file changed: $file" >&2
                exit 1
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Get GitHub App bot user ID
        if: steps.changes.outputs.changed == 'true'
        id: app-bot-user
        run: echo "user-id=$(gh api "/users/${{ steps.ops-app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.ops-app-token.outputs.token }}

      - name: Commit staging image promotion
        if: steps.changes.outputs.changed == 'true'
        working-directory: ops
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "${{ steps.ops-app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-bot-user.outputs.user-id }}+${{ steps.ops-app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add k8s/workload/gyeoltare/stg/api/kustomization.yaml k8s/workload/gyeoltare/stg/web/kustomization.yaml
          git commit -m "chore(stg): promote images from ${SOURCE_SHA}"
          git push origin HEAD:main

  open-production-pull-request:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6

      - name: Download published image metadata
        uses: actions/download-artifact@v8
        with:
          pattern: published-image-*
          path: published-images
          merge-multiple: true

      - name: Create GitHub App token for ops repository
        id: ops-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OPS_REPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPS_REPO_APP_PRIVATE_KEY }}
          owner: gwak2837
          repositories: |
            gyeoltare-ops
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout ops repository
        uses: actions/checkout@v6
        with:
          repository: gwak2837/gyeoltare-ops
          ref: main
          fetch-depth: 0
          path: ops
          token: ${{ steps.ops-app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: 5.6.0

      - name: Update production kustomization images
        run: node ./scripts/update-ops-image-patches.mjs --artifacts-dir ./published-images --ops-repo-dir ./ops --environment prod

      - name: Validate production kustomize build
        run: kustomize build ./ops/k8s/workload/gyeoltare/prod >/dev/null

      - name: Ensure only production kustomization changed
        id: changes
        working-directory: ops
        run: |
          changed_files="$(git diff --name-only)"

          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              k8s/workload/gyeoltare/prod/api/kustomization.yaml|k8s/workload/gyeoltare/prod/web/kustomization.yaml)
                ;;
              *)
                echo "Unexpected file changed: $file" >&2
                exit 1
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Get GitHub App bot user ID
        if: steps.changes.outputs.changed == 'true'
        id: app-bot-user
        run: echo "user-id=$(gh api "/users/${{ steps.ops-app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.ops-app-token.outputs.token }}

      - name: Create production promotion pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: ops
          token: ${{ steps.ops-app-token.outputs.token }}
          branch: automation/promote-prod
          delete-branch: true
          commit-message: "chore(prod): promote images from ${{ github.sha }}"
          title: "chore(prod): promote images from main"
          author: ${{ steps.ops-app-token.outputs.app-slug }}[bot] <${{ steps.app-bot-user.outputs.user-id }}+${{ steps.ops-app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.ops-app-token.outputs.app-slug }}[bot] <${{ steps.app-bot-user.outputs.user-id }}+${{ steps.ops-app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          body: |
            ## Summary
            - update production image digests from `gyeoltare` `main`
            - keep the production rollout change limited to the prod kustomization image entries

            ## Links
            - [Source commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Web image package](${{ github.server_url }}/users/${{ github.repository_owner }}/packages/container/package/gyeoltare-web)
            - [API image package](${{ github.server_url }}/users/${{ github.repository_owner }}/packages/container/package/gyeoltare-api)
          add-paths: |
            k8s/workload/gyeoltare/prod/api/kustomization.yaml
            k8s/workload/gyeoltare/prod/web/kustomization.yaml
