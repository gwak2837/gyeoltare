name: Publish Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            app_name: gyeoltare-web
            dockerfile: apps/web/Dockerfile
          - app: api
            app_name: gyeoltare-api
            dockerfile: apps/api/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize registry owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            CI=true
            COMMIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Sign image digest
        env:
          IMAGE_NAME: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Persist digest metadata
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          node <<'EOF'
          import { writeFileSync } from "node:fs";

          const outputPath = `${process.cwd()}/published-image-${process.env.APP}.json`;
          const tags = process.env.TAGS.split("\n").filter(Boolean);
          
          const payload = {
            image: process.env.IMAGE_NAME,
            digest: process.env.DIGEST,
            tags,
            workflow: process.env.WORKFLOW_NAME,
          };

          writeFileSync(outputPath, `${JSON.stringify(payload, null, 2)}\n`);
          EOF

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: published-image-${{ matrix.app }}
          path: published-image-${{ matrix.app }}.json

      - name: Write job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## ${{ matrix.app_name }}"
            echo
            echo "- Image: \`${IMAGE_NAME}@${DIGEST}\`"
            echo "- Tags:"
            printf '%s\n' "$TAGS" | while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              echo "  - \`${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
